[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victim-ppo"
version = "0.1.0"
description = "PPO victim agent using the pinned shared victimagent V4 environment"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<3.0",
  "PyYAML>=6.0,<7.0",
  "stable-baselines3==2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

